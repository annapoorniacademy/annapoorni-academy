version: '3.8'

services:
  # Unified Single-Domain Service (Mirrors Google Cloud Run production build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annapoorni_unified_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FLASK_ENV: production
      PORT: 8080
      SECRET_KEY: dev-local-secret-key-2026
      JWT_SECRET_KEY: dev-local-jwt-secret-2026
      DATABASE_URL: sqlite:////app/annapoorni.db
      FRONTEND_URL: http://localhost:8080
    volumes:
      - app_data:/app/uploads

volumes:
  app_data:
